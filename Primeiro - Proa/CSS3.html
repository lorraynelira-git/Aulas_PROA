<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 2 - CSS3 alt</title>

    <style>

        /* Adicionar o mesmo estilo para a mesma tag */

        body {
            background-color: rgb(208, 228, 235);
        }
        h1 {
            color: rgb(43, 142, 235);
            background-color: rgb(230, 135, 72);
            text-align: center;
        }

    </style>

</head>
<body>
   
    <!-- Outra forma de estilizar uma unica tag quando ja estabeleceu um estilo para o conjunto de tags é escrevendo style dentro da tag que você quer estilizar -->

    <h1 style="color: rgb(223, 229, 235); background-color: rgb(136, 98, 136); text-align: center; font-size: 50px;">Primeira Aula</h1>
    <h1>Segunda Aula</h1>
    <h1>Terceira Aula</h1>

    <!-- Outra forma de estilizar a tag é escrevendo style dentro da tag p -->

    <p style="text-align: center; color: rgb(43, 142, 235); background-color: rgb(230, 135, 72);">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
    
</body>
</html>
