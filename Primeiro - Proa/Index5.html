<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagem</title>
</head>
<body>

<!-- Para adicionar uma imagem use a tag <img> -->
 <!-- Utilize as propriedades src, alt, width e height para configurar a imagem -->
  <!-- A tag alt é utilizada para descrever a imagem em caso de não conseguir carregá-la -->
<img src="src/images/3X4 LL.png" alt="Lorrayne Lira" width="300" height="600">

<!-- Imagem com legenda -->
 <!-- A tag <figure> é utilizada para agrupar a imagem e sua legenda -->
    <!-- A tag <figure> é utilizada para agrupar a imagem e sua legenda -->
<figure>
  <img src="src/images/3X4 LL.png" alt="Lorrayne Lira" width="300" height="600">
  <figcaption>Minha foto 3x4</figcaption>
</figure>

</body>
</html>
