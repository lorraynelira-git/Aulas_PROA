<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 2 - CSS 1</title>

    <!-- CSS - Treino dentro do HTML -->
    <!-- Tem duas opções: 1 - Colocar a tag <style> dentro do <head> ou 2 - Colocar o styles em uma pasta -->

    <style>
      /* Cor do fundo da página */
      body {
        background-color: rgb(71, 172, 202);
      }

      /* Cor do título */
      h1 {
        color: rgb(10, 74, 126);
      }

      /* Cor do fundo do título */
      h1 {
        background-color: rgb(255, 255, 255);
      }

      /* Cor do parágrafo */
      p {
        color: rgb(10, 74, 126);
      }
    </style>
  </head>

  <body>
    <h1>Título da Página</h1>
    <p>Este é um parágrafo de exemplo.</p>
  </body>
</html>
