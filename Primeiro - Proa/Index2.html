<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafo</title>
</head>
<body>
    <!-- Para adicionar parágrafos, use a tag <p> -->
        <!-- Para textos em itálico, use a tag <i> ou <em> -->
                <!-- Para textos em negrito, use a tag <strong> -->
                    <!-- Para sublinhar textos, use a tag <u> -->
    <p>Este é <i>um</i> parágrafo.</p>
    <p>Este é o <em>segundo</em> parágrafo.</p>
    <p>Este é o <strong>terceiro</strong> parágrafo.</p>
    <p>Este é o <strong>quarto</strong> parágrafo.</p>
    <p>Lore ipsum <u>dolor sit amet</u>, consectetur adipiscing elit.</p>
    <p>Lorem ipsum <u>dolor sit amet</u>, consectetur adipiscing elit.</p>
</body>
</html>
