<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
</head>
<body>
    
    <h1>Links</h1>

    <!-- Para adicionar links, use a tag <a> -->
    <a href="https://www.google.com.br/">Google</a>
    <br>
    <a href="https://www.youtube.com/">YouTube</a>
    <br>
    <a href="https://www.instagram.com/">Instagram</a>
    <br>

    <!-- A tag <a> com o atributo href define o destino do link/cria o link -->
        <!-- href="URL", indica a URL para a qual o link aponta -->

        <a href="https://www.google.com.br/" target="_blank">Google</a>
        <!-- O atributo target="_blank" abre o link em uma nova aba -->
         <br><br>

        <!-- Link para outra página do seu próprio site -->
        <a href="index1.html">Hello World</a>
        <br>

        <!-- Link para enviar email -->
        <a href="mailto:contato@exemplo.com">Envie um email</a>
        <br>
       
        <!-- Link para chamar um número de telefone -->
        <a href="tel:+551112345678">Ligue para nós</a>


</body>
</html>
