<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Inline-Block + None</title>

    <link rel="stylesheet" href="Styles.css">

</head>
<body>
    
    <h2>Display Block</h2>

<!-- Block -->
    <div class="elemento" id="div1">Div 1</div>
    <div class="elemento" id="div2">Div 2</div>
    <div class="elemento" id="div3">Div 3</div>
    <br></br>

    <h2>Display Inline</h2>
<!-- Inline -->
    <div class="elemento2" id="div1">Div 1</div>
    <div class="elemento2" id="div2">Div 2</div>
    <div class="elemento2" id="div3">Div 3</div>
    <br></br>

    <h2>Display Inline-Block</h2>
<!-- Inline-Block -->
    <div class="elemento3" id="div1">Div 1</div>
    <div class="elemento3" id="div2">Div 2</div>
    <div class="elemento3" id="div3">Div 3</div>
    <br></br>

    <h2>Display None</h2>
<!-- None -->
 <!-- O display: none remove o elemento do navegador,mas não remove do código -->
    <div class="elemento3" id="div1">Div 1</div>
    <div class="elemento4" id="div2">Div 2</div>
    <div class="elemento3" id="div3">Div 3</div>
    <br></br>

</body>
</html>
