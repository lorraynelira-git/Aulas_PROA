<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário - 1</title>
</head>
<body>

    <!-- Tag <form> para montar a estrutura -->
    <form>

        <!--Tipo text  -->

        <!-- label = é o texto que indica o campo -->
        <label for="nome">Digite seu nome</label>
        <!-- input = cria um espaço para o usuário interagir -->
         <!-- Type = Possui diverentes tipo e cada um identifica um -->
        <input type="text" name="nome" id="nome"/>

        <!-- Espaça as tags -->
        <br></br>

        <!-- Tipo número -->

        <label for="idade">Digite sua idade</label>
        <input type="number" name="idade" id="idade"/>

        <!-- Value = define um valor inicial para o campo, ou seja, o campo já aparece definido com ele -->
        <p>
            <input type="submit" value="Enviar"/>
            <input type="reset" value="Limpar"/>
        </p>

    </form>

</body>
</html>
