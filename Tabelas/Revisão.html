<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão das Tabelas</title>

    <link rel="stylesheet" href="styles/Revisão.css">

</head>
<body>
    <table> 
        <caption>Revisão das Tabelas</caption>

        <thead>
          <tr>
            <th>Produto</th>
            <th>Preço</th>
          </tr>  
        </thead>

        <tbody >
            <tr>
                <td>Arroz</td>
                <td>R$29,99</td>
            </tr>

            <tr>
                <td>Feijão</td>
                <td>R$10,99</td>
            </tr>

            <tr>
                <td>Café</td>
                <td>R$26,99</td>
            </tr>

        </tbody>

        <tfoot> 
            <tr>    
                <th>Total</th>
                <td>R$59,99</td>
            </tr>

        </tfoot>
    </table>
    
</body>
</html>
