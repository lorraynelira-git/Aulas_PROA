<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>

    <!-- Estrutura da Tabela -->
     <!-- TR - Tabela Row | Linha da Tabela -->
      <!-- TH - Tabela Header | Cabeçalho da Tabela -->
       <!-- TD - Tabela Data | Dados da Tabela -->


       <!-- A borda pode ser sólida, tracejada ou emoldurada -->
        <!-- Solid, Dashed, Double -->
    <table border="1">

        <!-- Primeira Linha da Tabela | Cabeçalho -->
        <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Cidade</th>
        </tr>

        <!-- Segunda Linha da Tabela | Dados da Tabela -->
        <tr>
            <td>João</td>
            <td>25</td>
            <td>São Paulo</td>
        </tr>

        <!-- Terceira Linha da Tabela | Dados da Tabela -->
        <tr>
            <td>Maria</td>
            <td>30</td>
            <td>Rio de Janeiro</td>
        </tr>

        <!-- Quarta Linha da Tabela | Dados da Tabela -->
        <tr>
            <td>Carlos</td>
            <td>28</td>
            <td>Belo Horizonte</td>
        </tr>

        <!-- Quinta Linha da Tabela | Dados da Tabela -->
        <tr>
            <td>Ana</td>
            <td>22</td>
            <td>Curitiba</td>
        </tr>

    </table>

    <table border="1">
        <tr>
            <th>Produto</th>
            <th>Preço</th>
            <th>Quantidade</th>
        </tr>
        <tr>
            <td>Café</td>
            <td>R$ 5,00</td>
            <td>10</td>
        </tr>
        <tr>
            <td>Pão</td>
            <td>R$ 3,00</td>
            <td>5</td>
        </tr>
        <tr>
            <td>Leite</td>
            <td>R$ 4,00</td>
            <td>8</td>
        </tr>
        <tr>
            <td>Farinha</td>
            <td>R$ 2,00</td>
            <td>15</td>
        </tr>
<br></br>
    </table>

</body>
</html>
