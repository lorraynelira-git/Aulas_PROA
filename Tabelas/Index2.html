<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas 2</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
           /* A table-layout: fixed; alinha as colunas das tabelas */
            table-layout: fixed;
        }
        th, td {
            border: 1px solid black;
            padding: 18px;
            text-align: left;
        }
        th {
            background-color: #000000;
            color: rgb(255, 255, 255);
            text-align: center;
        }
    </style> 

</head>
<body>
    
<table>
    <tr>
        <th>Nome</th>
        <th>Idade</th>
        <th>Cidade</th>
    </tr>
    <tr>
        <td>João</td>
        <td>25</td>
        <td>São Paulo</td>
    </tr>
    <tr>
        <td>Maria</td>
        <td>30</td>
        <td>Rio de Janeiro</td>
    </tr>
    <tr>
        <td>Carlos</td>
        <td>28</td>
        <td>Belo Horizonte</td>
    </tr>
    <tr>    
        <td>Ana</td>
        <td>22</td>
        <td>Curitiba</td>
    </tr>  
</table> 
<br></br>

<table>
   <tr>
        <th>Produto</th>
        <th>Preço</th>
        <th>Quantidade</th>
    </tr>
    <tr>
        <td>Café</td>
        <td>R$ 5,00</td>
        <td>10</td>
    </tr>
    <tr>
        <td>Pão</td>
        <td>R$ 3,00</td>
        <td>5</td>
    </tr>
    <tr>
        <td>Leite</td>
        <td>R$ 4,00</td>
        <td>8</td>
    </tr>

</table>

</body>
</html>
